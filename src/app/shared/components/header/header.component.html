<header class="app-header">
  <div class="app-header__container">
    <div class="app-header__row">
      <!-- Logo and Navigation -->
      <div class="app-header__brand">
        <a
          class="app-header__logo"
          [routerLink]="['/']"
          [attr.aria-label]="'COMMON.HOME_ARIA' | translate"
        >
          @if (isPublisherHost) {
            <!-- Mock Publisher Logo -->
            <div class="publisher-logo">
              <svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
                <rect width="120" height="40" rx="4" fill="#4F46E5" />
                <text
                  x="60"
                  y="24"
                  font-family="Arial"
                  font-size="16"
                  font-weight="bold"
                  fill="white"
                  text-anchor="middle"
                >
                  {{ 'COMMON.MOCK_PUBLISHER_LABEL' | translate }}
                </text>
              </svg>
            </div>
          } @else {
            <span class="fanar-brand">
              <img
                class="fanar-brand__mark fanar-brand__mark--light"
                src="assets/images/itqan-mark.svg"
                alt=""
                width="36"
                height="36"
                decoding="async"
              />
              <img
                class="fanar-brand__mark fanar-brand__mark--dark"
                src="assets/images/itqan-mark-dark.svg"
                alt=""
                width="36"
                height="36"
                decoding="async"
              />
              <span class="fanar-brand__text">
                <span class="fanar-brand__name">{{ 'COMMON.LOGO_ALT_CMS' | translate }}</span>
                <span class="fanar-brand__by">{{ 'COMMON.BY_ITQAN' | translate }}</span>
              </span>
            </span>
          }
        </a>
        <app-navigation-menu [links]="navLinks()"></app-navigation-menu>
      </div>

      <!-- Actions -->
      <div class="app-header__actions">
        <!-- Desktop Actions -->
        <div class="app-header__actions-desktop">
          <app-theme-switch></app-theme-switch>
          <app-lang-switch></app-lang-switch>
          <app-user-actions (logoutClicked)="onLogout()"></app-user-actions>
        </div>

        <!-- Mobile Menu Button -->
        <div class="app-header__actions-mobile">
          <button
            (click)="onMobileMenuToggle()"
            class="app-header__menu-btn"
            [attr.aria-label]="'COMMON.OPEN_MENU_ARIA' | translate"
          >
            <ng-icon name="lucideMenu" aria-hidden="true" />
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<app-mobile-menu
  [(isOpen)]="isMobileMenuOpen"
  [links]="navLinks()"
  (logout)="onLogout()"
></app-mobile-menu>
