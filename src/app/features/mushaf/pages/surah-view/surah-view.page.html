<section class="surah-view">
  @if (loading()) {
    <div class="surah-view__skeleton surah-view__skeleton--header"></div>
    <div class="surah-view__skeleton surah-view__skeleton--body"></div>
  } @else if (notFound()) {
    <app-state-message
      icon="lucideSearch"
      iconVariant="default"
      [title]="'MUSHAF.SURAH_NOT_FOUND' | translate"
      [message]="'ERRORS.NOT_FOUND' | translate"
      [secondaryActionLabel]="'MUSHAF.BACK_TO_INDEX' | translate"
      secondaryRouterLink="/mushaf"
    />
  } @else if (errorState()) {
    <app-state-message
      icon="lucideAlertCircle"
      iconVariant="error"
      [title]="'UI.SOMETHING_WENT_WRONG' | translate"
      [message]="'ERRORS.SERVER_ERROR' | translate"
      [actionLabel]="'UI.TRY_AGAIN' | translate"
      actionIcon="lucideRotateCw"
      (actionClick)="retry()"
    />
  } @else if (surahMeta() && startPage() && endPage()) {
    <header class="surah-view__header">
      <a class="surah-view__back" routerLink="/mushaf" [queryParams]="{ mushaf: selected().slug }">
        {{ 'MUSHAF.BACK_TO_INDEX' | translate }}
      </a>
      <h1 class="surah-view__name">{{ surahMeta()!.nameArabic }}</h1>
      <p class="surah-view__meta">{{ surahMeta()!.nameEnglish }} · {{ selected().nameAr }}</p>
      <div class="surah-view__toolbar"><app-mushaf-switcher /></div>
    </header>

    <app-mushaf-scroll
      [slug]="selected().slug"
      [startPage]="startPage()!"
      [endPage]="endPage()!"
      (ayahClick)="onAyahClick($event)"
    />
  }
</section>
