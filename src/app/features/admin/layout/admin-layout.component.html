<nz-layout class="admin-layout" [attr.dir]="layoutDir()">
  <!-- Top Header Component styled like main CMS header -->
  <nz-header class="admin-header-shell">
    <div class="app-header">
      <div class="app-header__container">
        <div class="app-header__row">
          <!-- Logo -->
          <div class="app-header__brand">
            <button
              class="app-header__menu-btn admin-desktop-toggle"
              (click)="isCollapsed.set(!isCollapsed())"
            >
              <ng-icon name="lucideMenu" aria-hidden="true" />
            </button>
            <button class="app-header__menu-btn admin-mobile-toggle" (click)="onMobileMenuToggle()">
              <ng-icon name="lucideMenu" aria-hidden="true" />
            </button>
            <a
              class="app-header__logo"
              [routerLink]="['/']"
              [attr.aria-label]="'ADMIN.HOME' | translate"
            >
              @if (isPublisherHost) {
                <div class="publisher-logo">
                  <svg
                    width="120"
                    height="40"
                    viewBox="0 0 120 40"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <rect width="120" height="40" rx="4" fill="#4F46E5" />
                    <text
                      x="60"
                      y="24"
                      font-family="Arial"
                      font-size="16"
                      font-weight="bold"
                      fill="white"
                      text-anchor="middle"
                    >
                      {{ 'COMMON.MOCK_PUBLISHER_LABEL' | translate }}
                    </text>
                  </svg>
                </div>
              } @else {
                <img
                  [alt]="'COMMON.LOGO_ALT_CMS' | translate"
                  loading="lazy"
                  width="120"
                  height="40"
                  decoding="async"
                  class="app-header__logo-img"
                  src="assets/images/logo.svg"
                />
              }
            </a>
          </div>

          <div class="admin-header-tenant admin-header-tenant--desktop">
            <nz-select
              class="admin-header-tenant__select"
              [attr.aria-label]="'ADMIN.TENANT.ARIA_LABEL' | translate"
              [ngModel]="tenantService.selectedPublisherId()"
              (ngModelChange)="onTenantChange($event)"
              [nzPlaceHolder]="'ADMIN.TENANT.PLACEHOLDER' | translate"
              [nzLoading]="tenantService.isLoading()"
              [nzNotFoundContent]="'ADMIN.TENANT.EMPTY' | translate"
              [nzDisabled]="tenantService.isLoading() || tenantService.publishers().length === 0"
              nzShowSearch
              nzSize="large"
            >
              @for (publisher of tenantService.publishers(); track publisher.id) {
                <nz-option [nzValue]="publisher.id" [nzLabel]="publisher.name"></nz-option>
              }
            </nz-select>
          </div>

          <!-- Actions -->
          <div class="app-header__actions">
            <!-- Ensure actions display flex properly always -->
            <div class="admin-header-actions">
              <app-lang-switch></app-lang-switch>
              <app-user-actions (logoutClicked)="onLogout()"></app-user-actions>
            </div>
          </div>
        </div>

        <div class="admin-header-tenant admin-header-tenant--mobile">
          <nz-select
            class="admin-header-tenant__select"
            [attr.aria-label]="'ADMIN.TENANT.ARIA_LABEL' | translate"
            [ngModel]="tenantService.selectedPublisherId()"
            (ngModelChange)="onTenantChange($event)"
            [nzPlaceHolder]="'ADMIN.TENANT.PLACEHOLDER' | translate"
            [nzLoading]="tenantService.isLoading()"
            [nzNotFoundContent]="'ADMIN.TENANT.EMPTY' | translate"
            [nzDisabled]="tenantService.isLoading() || tenantService.publishers().length === 0"
            nzShowSearch
            nzSize="large"
          >
            @for (publisher of tenantService.publishers(); track publisher.id) {
              <nz-option [nzValue]="publisher.id" [nzLabel]="publisher.name"></nz-option>
            }
          </nz-select>
        </div>
      </div>
    </div>
  </nz-header>

  <nz-layout class="admin-body ant-layout-has-sider">
    <!-- Sidebar Navigation -->
    <app-admin-sidebar
      [(isCollapsed)]="isCollapsed"
      [(isMobileMenuOpen)]="isMobileMenuOpen"
    ></app-admin-sidebar>

    <!-- Main Content Panel -->
    <nz-content class="admin-content-area">
      <div class="admin-content-inner">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
